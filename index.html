<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>HKバス どれでも行ける？</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans JP","Noto Sans TC",sans-serif;background:#f3f4f6;color:#111827}
body{display:flex;flex-direction:column}
header{background:#111827;color:#fff;padding:10px 10px 8px;z-index:1000;position:relative}
.row{display:flex;gap:6px;align-items:center}
#destInput{flex:1;font-size:16px;padding:10px 12px;border-radius:10px;border:0;outline:none}
header button{background:#374151;color:#fff;border:0;border-radius:10px;padding:10px 11px;font-size:14px;white-space:nowrap}
header button.on{background:#2563eb}
#suggest{position:absolute;left:10px;right:10px;top:56px;background:#fff;color:#111;border-radius:10px;box-shadow:0 8px 24px #0004;max-height:55vh;overflow:auto}
.sg{padding:10px 12px;border-bottom:1px solid #eee}.sg small{display:block;color:#6b7280;font-size:12px}
#recent{display:flex;gap:6px;overflow-x:auto;margin-top:7px}
#recent:empty{display:none}
#recent button{background:#1f2937;padding:5px 10px;font-size:12px;border-radius:999px}
.row2{display:flex;gap:6px;margin-top:7px;align-items:center}
#modeHint{font-size:11px;color:#9ca3af;flex:1}
#settings{display:none;background:#1f2937;border-radius:10px;padding:8px 10px;margin-top:7px;font-size:13px}
#settings.open{display:block}
#settings label{display:flex;align-items:center;gap:8px;margin:4px 0}
#settings input{flex:1}
#map{height:38vh;min-height:180px}
body.listFull #map{height:0;min-height:0}
#panel{flex:1;overflow:auto;padding:8px 8px 40px}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#stopSel{flex:1;font-size:14px;padding:8px;border-radius:8px;border:1px solid #d1d5db;background:#fff;min-width:0}
.bar button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 10px;font-size:14px}
#updated{font-size:11px;color:#6b7280;margin:0 2px 6px}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px #0001;border-left:5px solid #d1d5db}
.card.soon{border-left-color:#16a34a}
.card.sel{outline:2px solid #16a34a}
.top{display:flex;align-items:center;gap:10px}
.no{font-size:28px;font-weight:800;min-width:64px;letter-spacing:-.5px}
.dir{flex:1;font-size:13px;line-height:1.3}
.co{font-size:11px;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:6px}
.etas{text-align:right;white-space:nowrap}
.eta{display:inline-block;font-size:13px;color:#374151;margin-left:6px}
.eta.first{font-size:20px;font-weight:800;color:#16a34a}
.st{font-size:13px;margin-top:4px}
.muted{color:#6b7280;font-size:12px}
.empty{padding:30px 10px;text-align:center;color:#6b7280;line-height:1.8}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 6px #0006}
.pin{line-height:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;transition:.3s;z-index:2000;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="row">
    <input id="destInput" placeholder="目的地（例：銅鑼灣、Star Ferry）" autocomplete="off">
    <button id="setBtn">⚙</button>
  </div>
  <div id="suggest"></div>
  <div id="recent"></div>
  <div class="row2">
    <button id="gpsBtn">📍 現在地</button>
    <button id="pickOrigin">出発地を地図で</button>
    <span id="modeHint"></span>
  </div>
  <div id="settings">
    <label>乗車まで徒歩 <input type="range" id="r1" min="100" max="1000" step="50"> <span id="r1v"></span></label>
    <label>降りてから徒歩 <input type="range" id="r2" min="100" max="1500" step="50"> <span id="r2v"></span></label>
    <div class="muted" style="color:#9ca3af">範囲を広げるほど候補の路線が増えます。九巴・城巴・嶼巴（龍運を含む）が対象です。</div>
  </div>
</header>
<div id="map"></div>
<div id="panel">
  <div class="bar">
    <select id="stopSel"></select>
    <button id="refresh">↻</button>
    <button id="expand">⇕</button>
  </div>
  <div id="updated"></div>
  <div id="list"></div>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
